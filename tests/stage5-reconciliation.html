<!doctype html><html><head><meta charset="utf-8"><title>Vault Stage 5 Reconciliation Test</title></head><body>
<div id="boot"></div><button class="brand">V</button><nav id="main-nav"></nav><input id="global-search"><div id="view-code"></div><div id="view-title"></div><div id="view"></div><div id="schema-version"></div><div id="event-count"></div><div id="level-chip"></div><div id="observation-strip"></div><button id="palette-button"></button><button id="discovery-button"></button><div id="toast-region"></div><div id="modal-root"></div><div id="palette-root"></div><input id="import-input" type="file"><pre>RUNNING</pre>
<script type="module">
const report=value=>{const text=typeof value==="string"?value:JSON.stringify(value);document.querySelector("pre").textContent=text;localStorage.setItem("vault_stage5_result",text)};const pause=(ms=100)=>new Promise(r=>setTimeout(r,ms));
window.addEventListener("error",e=>report(`ERROR ${e.message}`));window.addEventListener("unhandledrejection",e=>report(`REJECTION ${e.reason?.stack||e.reason}`));
try{await import("../js/app.js");await pause(500);const store=await import("../js/core/store.js");const sentinel=await import("../js/systems/sentinel.js");const lab=await import("../js/systems/reconciliationLab.js");const {runHealthCheck}=await import("../js/systems/health.js");
const links=()=>Object.values(store.getState().items).filter(i=>i.wing==="tv").flatMap(i=>Object.values(i.episodes||{})).map(e=>`${e.id}|${e.sourcePath||""}`).sort();const before=links();
await sentinel.runSentinelScan({quiet:true});await store.flushPersistence();const firstState=store.getState().metadata.stage5;const first=firstState.proposals[0];lab.decideReconciliationProposal(first.id,"deferred");await sentinel.runSentinelScan({quiet:true});await store.flushPersistence();
const stage5=store.getState().metadata.stage5;const after=links();document.querySelector('[data-route="reconcile"]').click();await pause(600);const health=runHealthCheck();report({result:"ok",schema:store.getState().schemaVersion,summary:stage5.summary,proposalCount:stage5.proposals.length,generations:stage5.generations.length,decisionPreserved:stage5.proposals.find(p=>p.id===first.id)?.status==="deferred",deterministicId:first.id===stage5.proposals.find(p=>p.proposedPath===first.proposedPath&&p.showId===first.showId)?.id,linksUnchanged:JSON.stringify(before)===JSON.stringify(after),page:{title:document.querySelector("#view-title").textContent,code:document.querySelector("#view-code").textContent,cards:document.querySelectorAll(".reconcile-card").length,notice:/NO AUTOMATIC RELINKING/i.test(document.querySelector("#view").textContent)},health:{ok:health.ok,issues:health.issues.slice(0,10),count:health.issues.length,proposals:health.reconciliationProposals}})}
catch(error){report(`TEST ERROR ${error.stack||error}`)}
</script></body></html>
