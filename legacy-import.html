<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vault Reconstruction — Legacy Intake</title>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    body{padding:28px}.intake{max-width:980px;margin:auto}.intake h1{font:16px/1.7 var(--pixel);color:var(--amber)}
    .drop{display:block;margin:18px 0;padding:35px;border:3px dashed #756044;background:#17130fcc;text-align:center;cursor:pointer}
    .drop:hover{border-color:var(--amber)}.drop input{display:none}.report{display:none}.report.ready{display:block}
    .manifest{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px;margin:16px 0}
    .manifest div{background:#17130f;border:1px solid #554938;padding:12px}.manifest b{display:block;color:var(--amber);font:13px var(--pixel);margin-bottom:7px}
    .log{white-space:pre-wrap;background:#0d0b08;border:2px solid #000;padding:12px;color:#a99f8b;max-height:250px;overflow:auto}
  </style>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>
  <main class="intake">
    <p class="eyebrow">VAULT://LEGACY-INTAKE</p>
    <h1>PREVIOUS ITERATION RECOVERY</h1>
    <p class="muted">This console scans old files without changing them. Select the old Vault HTML and its exported <code>vault.v1</code> progress JSON together if you have both.</p>
    <section class="panel">
      <label class="drop">
        <input id="legacy-files" type="file" accept=".html,.htm,.json,text/html,application/json" multiple>
        <b>SELECT LEGACY FILES</b><br><span class="muted">THE VAULT.HTML + OPTIONAL PROGRESS JSON</span>
      </label>
      <div id="status" class="muted">NO FILES SCANNED.</div>
    </section>
    <section id="report" class="panel report">
      <div class="panel__header"><h2>DRY-RUN MANIFEST</h2><span class="panel__code">NO CHANGES YET</span></div>
      <div id="manifest" class="manifest"></div>
      <p id="progress-note"></p>
      <label><input id="remove-samples" type="checkbox" checked> Remove the fictional Alpha sample records during merge</label>
      <div class="button-row">
        <button id="merge" class="button primary">MERGE VERIFIED IMPORT</button>
        <a class="button" href="./index.html">RETURN TO VAULT</a>
      </div>
      <pre id="warnings" class="log"></pre>
    </section>
  </main>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <script type="module" src="./js/legacy-import-app.js"></script>
</body>
</html>
